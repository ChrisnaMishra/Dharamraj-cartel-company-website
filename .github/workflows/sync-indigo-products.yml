name: Sync Indigo kitchenware details

on:
  push:
    branches: [development]
    paths:
      - 'scripts/sync_indigo_products.py'
      - 'indigo_images/products.json'
      - '.github/workflows/sync-indigo-products.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indigo-product-detail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install requests beautifulsoup4
      - name: Fetch all supplier product details
        run: python scripts/sync_indigo_products.py
      - name: Commit generated details
        run: |
          if git diff --quiet -- indigo_images/product-details.json; then
            echo "Product detail catalogue has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indigo_images/product-details.json
          git commit -m "Sync Indigo kitchenware product details"
          git push origin HEAD:development
