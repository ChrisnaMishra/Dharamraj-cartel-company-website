name: Sync Indigo kitchenware details (C++)

on:
  push:
    branches: [development]
    paths:
      - 'scripts/product_scraper.cpp'
      - 'indigo_images/products.json'
      - '.github/workflows/sync-indigo-products.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indigo-product-detail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libcurl4-openssl-dev nlohmann-json3-dev

      - name: Compile C++ scraper
        run: g++ -std=c++17 -O2 scripts/product_scraper.cpp -o /tmp/product_scraper $(pkg-config --cflags --libs libcurl)

      - name: Fetch all supplier product details
        run: /tmp/product_scraper

      - name: Commit generated details (including ignored output)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f indigo_images/product-details.json
          if git diff --cached --quiet; then
            echo "Product detail catalogue has no changes."
            exit 0
          fi
          git commit -m "Sync Indigo kitchenware product details using C++"
          git push origin HEAD:development
