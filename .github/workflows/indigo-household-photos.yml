name: Sync Indigo Household Product Photos

on:
  push:
    branches:
      - main
      - development
    paths-ignore:
      - "indigo_images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indigo-household-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-product-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install requests beautifulsoup4 Pillow

      - name: Validate collector syntax
        run: python -m py_compile tools/scrape_indigo.py

      - name: Collect real household product photos
        run: python tools/scrape_indigo.py

      - name: Commit optimised product photos and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indigo_images
          if git diff --cached --quiet; then
            echo "The product photo catalogue is already up to date."
          else
            git commit -m "Refresh Indigo household product photos"
            git push origin HEAD:development
          fi
